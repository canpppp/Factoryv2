name: FactoryV2 proofs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  proof:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install worker confinement backend
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm test
