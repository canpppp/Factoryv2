name: FactoryV2 proofs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  proof:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install worker confinement backend
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Reproduce R1 and R2 on reviewed baseline (synthetic Linux only)
        run: node tests/m02-r1-proof.test.js --baseline
      - name: Focused R1 and R2 consumer regressions
        run: node tests/m02-r1-proof.test.js
      - name: Controller role policy and durable session consumers
        run: node tests/controller-policy-proof.test.js
      - name: Daemon owner attachment and startup fencing (synthetic Linux only)
        run: node tests/owner-consumers-proof.test.js
      - name: Linux whole-namespace ownership (bounded synthetic fixtures)
        run: node tests/linux-ownership-proof.test.js
      - run: npm test
